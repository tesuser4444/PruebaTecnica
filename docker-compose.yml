services:
  app:
    build:
      context: .
    ports:
      - "3000:5000"
    environment:
      - DATABASE_URL=file:./database/dev.db 
    volumes:
      - ./backend/src/prisma/database/dev.db:/app/prisma/database/dev.db 
      - ./backend/src/.env:/app/.env 
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:3000" 
    volumes:
      - ./frontend/src:/usr/share/nginx/html 
    depends_on:
      - app 